<!doctype html>
<html lang="pt-BR">
<head>

  <title>Página não encontrada | Igor Romero</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0a0a" />
  <!-- O GitHub Pages serve este arquivo em qualquer caminho que não existe,
       então todos os caminhos são absolutos a partir de /portfolio/. -->
  <link rel="icon" type="image/svg+xml" href="/portfolio/assets/img/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="/portfolio/css/tokens.css" />
  <link rel="stylesheet" href="/portfolio/css/base.css" />
  <script defer src="/portfolio/data.js"></script>
  <script defer src="/portfolio/js/shell.js"></script>
</head>
<body data-pagina="404" data-base="/portfolio/">
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <!-- shell.js / base.css: cabeçalho com a navegação entre páginas -->

  <main id="conteudo">
    <section class="erro" aria-labelledby="erro-titulo">
      <h1 class="erro__codigo" id="erro-titulo">404</h1>
      <p class="erro__texto">Esta página não existe. O endereço pode ter mudado ou ter sido digitado errado.</p>
      <p class="erro__acoes">
        <a class="botao botao--cheio" href="/portfolio/">Voltar para o início</a>
        <a class="botao botao--contorno" href="/portfolio/projetos.html">Ver projetos</a>
      </p>
    </section>
  </main>

  <!-- shell.js / base.css -->
  <footer class="rodape" id="rodape"></footer>
